<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MyBudget</title>
  <meta name="theme-color" content="#3d5a30">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <button type="button" class="brand" data-action="go" data-view="overview" aria-label="MyBudget, kembali ke Ringkasan">MyBudget</button>
      <nav id="nav" aria-label="Menu utama">
        <button type="button" data-action="go" data-view="overview">
          <svg class="ic" width="24" height="24" viewBox="0 0 12 12" fill="currentColor" shape-rendering="crispEdges" aria-hidden="true"><path d="M5 0h2v1h-2zM4 1h4v1h-4zM3 2h6v1h-6zM2 3h8v1h-8zM1 4h10v1h-10zM0 5h12v1h-12zM1 6h10v1h-10zM1 7h10v1h-10zM1 8h4v1h-4zM7 8h4v1h-4zM1 9h4v1h-4zM7 9h4v1h-4zM1 10h4v1h-4zM7 10h4v1h-4zM1 11h4v1h-4zM7 11h4v1h-4z"/></svg>
          <span>Ringkasan</span>
        </button>
        <button type="button" data-action="go" data-view="transactions">
          <svg class="ic" width="24" height="24" viewBox="0 0 12 12" fill="currentColor" shape-rendering="crispEdges" aria-hidden="true"><path d="M9 1h1v1h-1zM10 2h1v1h-1zM1 3h11v1h-11zM10 4h1v1h-1zM9 5h1v1h-1zM3 7h1v1h-1zM2 8h1v1h-1zM0 9h11v1h-11zM2 10h1v1h-1zM3 11h1v1h-1z"/></svg>
          <span>Transaksi</span>
        </button>
        <button type="button" data-action="go" data-view="budgets">
          <svg class="ic" width="24" height="24" viewBox="0 0 12 12" fill="currentColor" shape-rendering="crispEdges" aria-hidden="true"><path d="M7 1h2v1h-2zM3 2h3v1h-3zM7 2h3v1h-3zM2 3h4v1h-4zM7 3h4v1h-4zM1 4h5v1h-5zM7 4h4v1h-4zM1 5h5v1h-5zM1 6h9v1h-9zM1 7h9v1h-9zM1 8h9v1h-9zM2 9h7v1h-7zM3 10h5v1h-5z"/></svg>
          <span>Anggaran</span>
        </button>
        <button type="button" data-action="go" data-view="targets">
          <svg class="ic" width="24" height="24" viewBox="0 0 12 12" fill="currentColor" shape-rendering="crispEdges" aria-hidden="true"><path d="M4 0h4v1h-4zM2 1h2v1h-2zM8 1h2v1h-2zM1 2h1v1h-1zM10 2h1v1h-1zM1 3h1v1h-1zM4 3h4v1h-4zM10 3h1v1h-1zM0 4h1v1h-1zM3 4h1v1h-1zM8 4h1v1h-1zM11 4h1v1h-1zM0 5h1v1h-1zM3 5h1v1h-1zM5 5h2v1h-2zM8 5h1v1h-1zM11 5h1v1h-1zM0 6h1v1h-1zM3 6h1v1h-1zM5 6h2v1h-2zM8 6h1v1h-1zM11 6h1v1h-1zM0 7h1v1h-1zM3 7h1v1h-1zM8 7h1v1h-1zM11 7h1v1h-1zM1 8h1v1h-1zM4 8h4v1h-4zM10 8h1v1h-1zM1 9h1v1h-1zM10 9h1v1h-1zM2 10h2v1h-2zM8 10h2v1h-2zM4 11h4v1h-4z"/></svg>
          <span>Target</span>
        </button>
        <button type="button" data-action="go" data-view="manage">
          <svg class="ic" width="24" height="24" viewBox="0 0 12 12" fill="currentColor" shape-rendering="crispEdges" aria-hidden="true"><path d="M7 1h2v1h-2zM0 2h12v1h-12zM7 3h2v1h-2zM2 5h2v1h-2zM0 6h12v1h-12zM2 7h2v1h-2zM9 9h2v1h-2zM0 10h12v1h-12zM9 11h2v1h-2z"/></svg>
          <span>Kelola</span>
        </button>
      </nav>
    </div>
  </header>

  <main id="view" class="container"></main>

  <dialog id="dialog"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <noscript><p style="padding:16px">MyBudget memerlukan JavaScript.</p></noscript>

  <script>
    // Safety net: if the app could not draw anything, say so instead of leaving a blank page.
    (function () {
      var errors = [];
      window.addEventListener('error', function (e) { errors.push(e.message); });
      window.addEventListener('load', function () {
        var v = document.getElementById('view');
        if (!v || v.firstElementChild) return;
        var box = document.createElement('div'), msg = document.createElement('span');
        box.className = 'banner';
        msg.textContent = 'MyBudget gagal dimuat. Pastikan index.html, styles.css, logic.js, dan app.js semuanya versi terbaru dan berada di satu folder, lalu muat ulang halaman.' + (errors.length ? ' Detail: ' + errors[0] : '');
        box.appendChild(msg);
        v.appendChild(box);
      });
    })();
  </script>
  <script>
    if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
      window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
    }
  </script>
  <script src="logic.js"></script>
  <script src="app.js"></script>
</body>
</html>
